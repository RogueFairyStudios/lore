[workspace]
resolver = "2"
members = ["."]

[package]
name = "rfs-lore-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rogue Fairy Studios authentik OIDC token-exchange and per-project repository registry service for Lore"

[lib]
name = "rfs_lore_bridge"
test = false

[[bin]]
name = "rfs-lore-bridge"
path = "src/main.rs"
test = false

[features]
test-util = []

[dependencies]
lore-base = { path = "../../../../lore-base" }
lore-macro = { path = "../../../../lore-macro" }
lore-proto = { path = "../../../../lore-proto" }

anyhow = "1.0.103"
axum = { version = "0.8.4", default-features = false, features = [
    "form",
    "http1",
    "http2",
    "json",
    "tokio",
] }
base64 = "0.22.1"
blake3 = "1.8.2"
clap = { version = "4.5.47", features = ["derive"] }
hex = "0.4.3"
jsonwebtoken = { version = "9.3.1", default-features = false }
parking_lot = "0.12.4"
reqwest = { version = "0.12.23", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
ring = "0.17.14"
serde = { version = "1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.143", default-features = false, features = ["std"] }
serde_with = { version = "3.14.0", default-features = false, features = ["alloc", "macros"] }
thiserror = "2.0.16"
tokio = { version = "1.53.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1.17", default-features = false }
tokio-util = { version = "0.7.15", default-features = false, features = ["rt"] }
toml = "0.9.5"
tonic = { version = "0.14.2", default-features = false, features = [
    "codegen",
    "router",
    "server",
] }
tracing = { version = "0.1.41", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"

[dev-dependencies]
rfs-lore-bridge = { path = ".", features = ["test-util"] }
lore-base = { path = "../../../../lore-base", features = ["test-util"] }
axum = { version = "0.8.4", default-features = false, features = ["query"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json"] }
tonic = { version = "0.14.2", default-features = false, features = [
    "channel",
    "codegen",
    "router",
    "server",
] }

[lints]
workspace = true

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
checked_conversions = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
